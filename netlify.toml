# Netlify – mouse-3d-lp (Vue + Vite SPA)
[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "20" }

# SPA: todas las rutas sirven index.html (vue-router history mode)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad y caché (opcional)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
